name: Team vault

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-vault
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/backup-vault.mjs
      - name: Save vault to git
        run: |
          git config user.name "restprime-vault"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamVault.json public/teamVault.json
          if git diff --staged --quiet; then
            echo "Сейф без изменений"
          else
            git commit -m "Чтобы сейф команды на GitHub держал свежие задачи, заметки и план."
            git push
          fi
