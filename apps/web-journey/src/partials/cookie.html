<div class="cookie" data-cookie hidden>
  <div class="cookie__bar" role="dialog" aria-labelledby="cookie-title">
    <p id="cookie-title">Сайт для лиц 18+. Необходимые cookies хранят только ваш выбор и заявки на этом устройстве. Подробнее — в <a href="/policy.html">политике</a>.</p>
    <div class="cookie__actions">
      <button type="button" data-cookie-accept>Понятно</button>
      <button type="button" class="btn-ghost" data-cookie-settings>Настроить</button>
    </div>
  </div>
  <form class="cookie__panel" data-cookie-panel hidden>
    <p>Настройки cookies</p>
    <label><input type="checkbox" checked disabled> Необходимые — выбор и локальные заявки</label>
    <label><input type="checkbox" name="analytics"> Аналитика — на этой витрине счётчик не подключён</label>
    <div class="cookie__actions">
      <button type="submit">Сохранить</button>
      <button type="button" class="btn-ghost" data-cookie-close>Закрыть</button>
    </div>
  </form>
</div>
<div class="lightbox" data-lightbox-root hidden>
  <button type="button" class="lightbox__close" data-lightbox-close aria-label="Закрыть">Закрыть</button>
  <img alt="" width="1600" height="1067">
</div>
